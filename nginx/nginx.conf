# Define a zona de cache no disco
# - levels=1:2       → estrutura de diretórios para os arquivos de cache
# - keys_zone=app_cache:10m → 10MB de memória para armazenar as chaves
# - max_size=100m     → máximo 100MB de cache no disco
# - inactive=60s      → remove entradas não acessadas por 60s
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=app_cache:10m max_size=100m inactive=60s;

server {
    listen 80;

    # Header para debug: mostra se a resposta veio do cache ou não
    # HIT = veio do cache, MISS = foi buscar no Fastify, BYPASS = cache desativado
    add_header X-Cache-Status $upstream_cache_status always;

    # Tempo que o Nginx esperou o Fastify responder (em segundos)
    # Em caso de HIT, mostra "-" pois não houve chamada ao upstream
    add_header X-Response-Time $upstream_response_time always;

    # ──────────────────────────────────────────────────
    # Endpoint de stats → COM cache (10 segundos)
    # GET /shorten/*/stats
    # ──────────────────────────────────────────────────
    location ~ ^/shorten/[^/]+/stats$ {
        proxy_pass http://app:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Ativar cache para esta location
        proxy_cache app_cache;
        proxy_cache_valid 200 10s;     # cacheia respostas 200 por 10 segundos
        proxy_cache_methods GET;       # só cacheia GET
        proxy_ignore_headers Set-Cookie;
    }

    # ──────────────────────────────────────────────────
    # Todos os outros endpoints → SEM cache
    # POST/PATCH/DELETE e GET redirect passam direto
    # ──────────────────────────────────────────────────
    location / {
        proxy_pass http://app:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Sem cache — requisições passam direto para o Fastify
        proxy_cache off;
    }
}
